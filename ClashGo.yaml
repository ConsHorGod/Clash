#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則模板<<<<<<<<<<<<<<<<<<<<
rule-anchor:
  classical: &classical
    type: http
    interval: 21600
    behavior: classical
    format: yaml
  domain: &domain
    type: http
    interval: 21600
    behavior: domain
    format: mrs
  ipcidr: &ipcidr
    type: http
    interval: 21600
    behavior: ipcidr
    format: mrs
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>規則集<<<<<<<<<<<<<<<<<<<<
rule-providers:
  LAN: { <<: *rule-set-domain, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs }
  LAN_IP: { <<: *rule-set-ipcidr, url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs }
  AWAvenue-Ads: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml }
  MY_DIRECT: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/MY_DIRECT.yaml }
  MY_PROXY: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/MY_PROXY.yaml }
  MY_REJECT: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/MY_REJECT.yaml }
  iOS_OTA: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/iOS_OTA.yaml }
  iOS_PUSH(DOMAIN): { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/iOS_PUSH(DOMAIN).yaml }
  iOS_PUSH(IP): { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/iOS_PUSH(IP).yaml }
  CN_ASN: { <<: *rule-set-classical, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/China_ASN.yaml }
  CN_Domain: { <<: *rule-set-domain, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/ChinaMax_Domain.mrs }
  CN_IP: { <<: *rule-set-ipcidr, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/ChinaMax_IP.mrs }
  Global_Domain: { <<: *rule-set-domain, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/Global_Domain.mrs }
  Global_IP: { <<: *rule-set-ipcidr, url: https://raw.githubusercontent.com/ConsHorGod/MY_RULE/main/RULESET/Global_IP.mrs }
  AI: { <<: *rule-set-domain, url: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/mihomo-ruleset/ai.mrs }
  TikTok: { <<: *rule-set-domain, url: https://raw.githubusercontent.com/DustinWin/ruleset_geodata/mihomo-ruleset/tiktok.mrs }
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>分流規則<<<<<<<<<<<<<<<<<<<<
rules:
  - RULE-SET,LAN,國內直連
  - RULE-SET,LAN_IP,DIRECT,no-resolve
  - RULE-SET,iOS_PUSH(DOMAIN),iOS通知
  - RULE-SET,iOS_PUSH(IP),iOS通知,no-resolve
  - RULE-SET,iOS_OTA,iOS更新
  - RULE-SET,MY_REJECT,REJECT-DROP,no-resolve
  - RULE-SET,AWAvenue-Ads,REJECT-DROP,no-resolve
  - RULE-SET,MY_DIRECT,國內直連
  - GEOSITE,apple,國內直連
  #- RULE-SET,CN_Domain,國內直連
  - GEOSITE,cn,國內直連
  #- RULE-SET,CN_IP,國內直連,no-resolve
  - GEOIP,CN,國內直連,no-resolve
  - RULE-SET,MY_PROXY,全球互聯
  #- RULE-SET,AI,AI
  - GEOSITE,category-ai-!cn,AI
  #- RULE-SET,TikTok,TikTok
  - GEOSITE,tiktok,TikTok
  #- RULE-SET,Global_Domain,全球互聯
  #- RULE-SET,Global_IP,全球互聯,no-resolve
  - GEOSITE,reddit,Reddit
  - GEOSITE,youtube,Google
  - GEOSITE,google,Google
  - GEOIP,GOOGLE,Google,no-resolve
  - GEOSITE,twitter,Twitter
  - GEOIP,TWITTER,Twitter,no-resolve
  - GEOSITE,telegram,Telegram
  - GEOIP,TELEGRAM,Telegram,no-resolve
  - GEOSITE,geolocation-!cn,全球互聯
  - RULE-SET,CN_ASN,國內直連
  #- NOT,((OR,((DST-PORT,80),(DST-PORT,443)))),國內直連
  - MATCH,全球互聯,dns-failed