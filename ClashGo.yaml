subscribe: https://raw.githubusercontent.com/ConsHorGod/Clash/refs/heads/main/ClashGo.yaml
mixed-port: 7890
allow-lan: true
log-level: info
bind-address: "*"
external-controller: 127.0.0.1:60000
unified-delay: true
tcp-concurrent: true
block-quic: true
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
geodata-mode: true
geo-auto-update: true
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
profile:
  store-selected: true
  store-fake-ip: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>隧道<<<<<<<<<<<<<<<<<<<<
tun:
  enable: true
  stack: system
  dns-hijack: ["any:53", "tcp://any:53"]
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>DNS模組<<<<<<<<<<<<<<<<<<<<
dns:
  enable: true
  ipv6: false
  listen: :23453
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16 
  default-nameserver: [119.29.29.29, 223.5.5.5]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  fake-ip-filter: ["+.lan", "*.local", "+.gstatic.com", "+.push.apple.com", "geosite:apple"]
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>代理節點<<<<<<<<<<<<<<<<<<<<
proxies:
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>策略組<<<<<<<<<<<<<<<<<<<<
proxy-groups:
  - { name: 全球互聯, type: select, include-all: true, proxies: [主機場(HK), 副機場(HK), 其它機場(HK), 其它節點, 急救機場, 國內直連], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png }
  - { name: iOS通知, type: select, proxies: [國內直連, 全球互聯], icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png }
  - { name: iOS更新, type: select, proxies: [國內直連, REJECT-DROP], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Puzzle.png }
  - { name: Google, type: select, include-all: true, proxies: [主機場(HK), 主機場(JP), 主機場(US)], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png }
  - { name: Reddit, type: select, include-all: true, proxies: [主機場(HK), 主機場(JP), 主機場(US)], icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/reddit(1).png }
  - { name: Telegram, type: select, include-all: true, proxies: [主機場(HK), 副機場(HK)], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png }
  - { name: TikTok, type: select, include-all: true, proxies: [主機場(JP), 主機場(US)], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png }
  - { name: AI, type: select, include-all: true, proxies: [主機場(JP), 主機場(US), 主機場(HK)], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png }
  - { name: Twitter, type: select, include-all: true, proxies: [主機場(HK), 主機場(US), 主機場(JP)], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png }
  - { name: 遊戲平台, type: select, proxies: [DIRECT, 全球互聯], icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/steam(1).png }
  - { name: 其它節點, type: select, include-all: true, filter: "^(?!.*(US 0|JP 0|TW 0|过期|客户端|推荐|官网|失联|发布|流量|剩余|群|套餐|客服|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|香港|HK|Hong|川日|东京|大阪|泉日|埼玉|Japan|日本|JP)).*$", icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/AAEX.png }
  - { name: 主機場(HK), <<: *url-test, filter: '香港', use: [主機場], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png }
  - { name: 副機場(HK), <<: *url-test, filter: '香港|HK', use: [副機場], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png }
  - { name: 主機場(JP), <<: *url-test, filter: '日本', use: [主機場], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png }
  - { name: 主機場(US), <<: *url-test, filter: '美国', use: [主機場], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png }
  - { name: 其它機場(HK), <<: *url-test, filter: '香港|HK', use: [其它機場], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png }
  - { name: 急救機場, <<: *url-test, use: [急救機場], icon: https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Rookie.png }
  - { name: 國內直連, type: select, hidden: true, proxies: [DIRECT], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CN.png }
