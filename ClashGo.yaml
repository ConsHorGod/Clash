subscribe: https://raw.githubusercontent.com/ConsHorGod/Clash/refs/heads/main/ClashGo.yaml
mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
bind-address: "*"
external-controller: 127.0.0.1:60000
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
block-quic: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/cn.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-only-cn-private.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
profile:
  store-selected: true
  store-fake-ip: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>隧道<<<<<<<<<<<<<<<<<<<<
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>DNS模組<<<<<<<<<<<<<<<<<<<<
dns:
  enable: true
  ipv6: true
  listen: :23453
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16 
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,iOS_PUSH,real-ip
    - RULE-SET,iOS_OTA,real-ip
    - RULE-SET,MY_DIRECT,real-ip
#    - GEOSITE,cn,real-ip
    - RULE-SET,CN_Domain,real-ip
    - RULE-SET,CN_ASN,real-ip
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>代理節點<<<<<<<<<<<<<<<<<<<<
proxies:
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>策略組<<<<<<<<<<<<<<<<<<<<
proxy-groups:
  - name: 全球互聯
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"
    hidden: false
    type: select
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 主機場(HK)
      - 副機場(HK)
      - 其它機場(HK)
      - 其它節點
      - 急救機場
      - DIRECT
  - name: 遊戲平台
    icon: "https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/steam(1).png"
    hidden: false
    type: select
    url: https://www.gstatic.com/generate_204
    proxies:
      - DIRECT
      - 全球互聯
  - name: iOS通知
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png"
    hidden: false
    type: select
    proxies:
      - DIRECT
      - 全球互聯
  - name: iOS更新
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Puzzle.png"
    hidden: false
    type: select
    proxies:
      - DIRECT
      - REJECT-DROP
  - name: 其它節點
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/AAEX.png
    hidden: false
    type: select
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: "^(?!.*(US 0|JP 0|TW 0|过期|客户端|推荐|官网|失联|发布|流量|剩余|群|套餐|客服|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|香港|HK|Hong|川日|东京|大阪|泉日|埼玉|Japan|日本|JP)).*$"
    use:
      - 主機場
      - 副機場
      - 其它機場
  - name: 主機場(HK)
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: '香港'
    use:
      - 主機場
  - name: 副機場(HK)
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: '香港|HK'
    use:
      - 副機場
  - name: 其它機場(HK)
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png"
    hidden: false
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: '香港|HK'
    use:
      - 其它機場
  - name: 主機場(JP)
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png"
    hidden: false
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    filter: '日本|JP'
    use:
      - 主機場
  - name: 急救機場
    icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Rookie.png"
    hidden: false
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    use:
      - 急救機場
#>>>>>>>>>>>>>>>>>>>>><<<<<<<<<<<<<<<<<<<<
#>>>>>>>>>>>>>>>>>>>>>機場訂閱<<<<<<<<<<<<<<<<<<<<
