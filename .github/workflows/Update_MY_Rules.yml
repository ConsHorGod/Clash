name: Update MY Rules MRS

on:
  push:
    paths:
      - "MY_DIRECT.yaml"
      - "MY_PROXY.yaml"
      - "MY_REJECT.yaml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest Mihomo
        shell: bash
        run: |
          set -e

          echo "Getting latest Mihomo release..."

          ASSET_URL=$(curl -fsSL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 60 \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep '/mihomo-linux-amd64-v3-' \
            | grep '\.gz$' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Mihomo Linux AMD64 v3 download URL not found."
            exit 1
          fi

          echo "Downloading:"
          echo "$ASSET_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 180 \
            "$ASSET_URL" \
            -o mihomo.gz

          gzip -df mihomo.gz
          chmod +x mihomo

          echo "Mihomo version:"
          ./mihomo version

      - name: Convert rules to MRS
        shell: bash
        run: |
          set -e

          mkdir -p RULESET

          echo "Converting MY_DIRECT..."
          ./mihomo convert-ruleset domain yaml \
            MY_DIRECT.yaml \
            RULESET/MY_DIRECT.mrs

          echo "Converting MY_PROXY..."
          ./mihomo convert-ruleset domain yaml \
            MY_PROXY.yaml \
            RULESET/MY_PROXY.mrs

          echo "Converting MY_REJECT..."
          ./mihomo convert-ruleset domain yaml \
            MY_REJECT.yaml \
            RULESET/MY_REJECT.mrs

      - name: Check generated files
        shell: bash
        run: |
          set -e

          echo "Generated MRS files:"
          ls -lh RULESET/MY_DIRECT.mrs
          ls -lh RULESET/MY_PROXY.mrs
          ls -lh RULESET/MY_REJECT.mrs

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RULESET/MY_DIRECT.mrs
          git add RULESET/MY_PROXY.mrs
          git add RULESET/MY_REJECT.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update MY rules MRS"
          git push