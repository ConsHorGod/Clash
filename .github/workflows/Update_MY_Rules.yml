name: Update_MY_Rules

on:
  push:
    paths:
      - "MY_DIRECT.yaml"
      - "MY_PROXY.yaml"
      - "MY_REJECT.yaml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget jq
          pip3 install --disable-pip-version-check requests beautifulsoup4

      - name: Prepare output directory
        run: |
          set -e
          mkdir -p RULESET

      - name: Download Mihomo
        run: |
          set -e

          echo "Getting latest Mihomo release..."

          ASSET_URL=$(curl -fsSL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | jq -r '.assets[].browser_download_url' \
            | grep 'mihomo-linux-amd64-v3-' \
            | grep '\.gz$' \
            | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "Failed to find Mihomo Linux amd64 v3 release."
            exit 1
          fi

          echo "Downloading:"
          echo "$ASSET_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 180 \
            "$ASSET_URL" \
            -o /tmp/mihomo.gz

          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo

          echo "Mihomo version:"
          /tmp/mihomo -v

      - name: Generate MY MRS
        run: |
          set -e

          mkdir -p RULESET

          echo "========================================"
          echo "Convert MY_DIRECT.yaml"
          echo "========================================"

          /tmp/mihomo convert-ruleset domain yaml \
            MY_DIRECT.yaml \
            RULESET/MY_DIRECT.mrs

          echo "========================================"
          echo "Convert MY_PROXY.yaml"
          echo "========================================"

          /tmp/mihomo convert-ruleset domain yaml \
            MY_PROXY.yaml \
            RULESET/MY_PROXY.mrs

          echo "========================================"
          echo "Convert MY_REJECT.yaml"
          echo "========================================"

          /tmp/mihomo convert-ruleset domain yaml \
            MY_REJECT.yaml \
            RULESET/MY_REJECT.mrs

      - name: Check MY MRS
        run: |
          set -e

          echo "Generated files:"

          ls -lh RULESET/MY_DIRECT.mrs
          ls -lh RULESET/MY_PROXY.mrs
          ls -lh RULESET/MY_REJECT.mrs

          test -s RULESET/MY_DIRECT.mrs
          test -s RULESET/MY_PROXY.mrs
          test -s RULESET/MY_REJECT.mrs

          echo "All MY MRS files are valid."

      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RULESET/MY_DIRECT.mrs
          git add RULESET/MY_PROXY.mrs
          git add RULESET/MY_REJECT.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update MY rules MRS"
          git push