name: Update MY Rules

on:
  push:
    paths:
      - "MY_DIRECT.yaml"
      - "MY_PROXY.yaml"
      - "MY_REJECT.yaml"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          curl -fL --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64-v3.gz" \
            -o mihomo.gz

          gzip -df mihomo.gz
          chmod +x mihomo

          ./mihomo version

      - name: Convert rules to MRS
        shell: bash
        run: |
          set -e

          mkdir -p RULESET

          ./mihomo convert-ruleset domain yaml \
            MY_DIRECT.yaml \
            RULESET/MY_DIRECT.mrs

          ./mihomo convert-ruleset domain yaml \
            MY_PROXY.yaml \
            RULESET/MY_PROXY.mrs

          ./mihomo convert-ruleset domain yaml \
            MY_REJECT.yaml \
            RULESET/MY_REJECT.mrs

      - name: Check generated files
        shell: bash
        run: |
          set -e

          ls -lh RULESET/MY_DIRECT.mrs
          ls -lh RULESET/MY_PROXY.mrs
          ls -lh RULESET/MY_REJECT.mrs

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RULESET/MY_DIRECT.mrs
          git add RULESET/MY_PROXY.mrs
          git add RULESET/MY_REJECT.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update MY rules MRS"
          git push