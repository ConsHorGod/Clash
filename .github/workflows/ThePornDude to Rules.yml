name: Update AdultWebsites Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            requests \
            beautifulsoup4 \
            tldextract

      - name: Download latest Mihomo
        run: |
          set -e

          URL=$(curl -fsSL --retry 3 --retry-delay 2 \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("^mihomo-linux-amd64.*\\.gz$"))
              | .browser_download_url
            ' \
            | head -n 1)

          test -n "$URL"

          echo "Downloading Mihomo:"
          echo "$URL"

          curl -fL --retry 5 --retry-delay 2 \
            "$URL" \
            -o /tmp/mihomo.gz

          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Crawl and extract registered domains
        run: |
          mkdir -p ruleset

          python3 <<'PY'
          import re
          import requests
          import tldextract

          from bs4 import BeautifulSoup
          from urllib.parse import (
              urljoin,
              urlparse,
              urldefrag
          )
          from collections import deque

          START_URL = "https://theporndude.com/zh"

          ALLOWED_HOSTS = {
              "theporndude.com",
              "www.theporndude.com",
          }

          EXCLUDED_DOMAINS = {
              "google.com",
              "googleapis.com",
              "googletagmanager.com",
              "google-analytics.com",
              "doubleclick.net",

              "twitter.com",
              "x.com",
              "facebook.com",
              "instagram.com",
              "youtube.com",
              "youtube-nocookie.com",
              "tiktok.com",

              "linkedin.com",
              "pinterest.com",
              "reddit.com",

              "cloudflare.com",
              "cdnjs.cloudflare.com",
          }

          URL_ATTRIBUTES = (
              "href",
              "src",
              "data-src",
              "data-url",
              "data-href",
              "data-link",
              "data-site",
              "data-domain",
              "action",
              "poster",
          )

          URL_REGEX = re.compile(
              r'https?://[^\s"\'<>\\]+',
              re.IGNORECASE
          )

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36",

              "Accept":
                  "text/html,application/xhtml+xml,"
                  "application/json,text/javascript,"
                  "text/css,application/xml,"
                  "*/*;q=0.8",

              "Accept-Language":
                  "zh-CN,zh;q=0.9,en;q=0.8",

              "Connection":
                  "keep-alive",
          })

          def normalize_host(host):
              if not host:
                  return ""

              host = host.lower().strip().rstrip(".")

              if host.startswith("www."):
                  host = host[4:]

              return host

          def registered_domain(host):
              host = normalize_host(host)

              if not host:
                  return ""

              try:
                  result = tldextract.extract(host)
              except Exception:
                  return ""

              if not result.domain or not result.suffix:
                  return ""

              return (
                  f"{result.domain}.{result.suffix}"
                  .lower()
              )

          def clean_url(url, base_url=None):
              if not url:
                  return None

              url = str(url).strip()

              if not url:
                  return None

              url = url.strip(
                  "\"'`()[]{}<>"
              )

              if base_url:
                  try:
                      url = urljoin(
                          base_url,
                          url
                      )
                  except Exception:
                      return None

              url, _ = urldefrag(url)

              try:
                  parsed = urlparse(url)
              except Exception:
                  return None

              if parsed.scheme not in (
                  "http",
                  "https",
              ):
                  return None

              if not parsed.hostname:
                  return None

              return url

          def normalize_internal_url(url):
              url = clean_url(url)

              if not url:
                  return None

              try:
                  parsed = urlparse(url)
              except Exception:
                  return None

              host = normalize_host(
                  parsed.hostname
              )

              if host not in ALLOWED_HOSTS:
                  return None

              path = parsed.path or "/"

              result = (
                  f"https://{host}{path}"
              )

              if parsed.query:
                  result += (
                      "?" + parsed.query
                  )

              return result

          def extract_urls(text, base_url):
              results = set()

              if not text:
                  return results

              for match in URL_REGEX.findall(text):

                  url = clean_url(
                      match,
                      base_url
                  )

                  if url:
                      results.add(url)

              return results

          queue = deque([START_URL])

          visited = set()

          domains = {
              "theporndude.com"
          }

          while queue:

              page = queue.popleft()

              if page in visited:
                  continue

              visited.add(page)

              print(
                  f"[PAGE {len(visited)}] {page}"
              )

              try:
                  response = session.get(
                      page,
                      timeout=25,
                      allow_redirects=True
                  )

                  if response.status_code != 200:
                      print(
                          "HTTP:",
                          response.status_code
                      )
                      continue

              except Exception as e:
                  print(
                      "FAILED:",
                      e
                  )
                  continue

              content_type = (
                  response.headers
                  .get(
                      "content-type",
                      ""
                  )
                  .lower()
              )

              # ==================================
              # HTML 页面
              # ==================================

              if (
                  "html" in content_type
                  or not content_type
              ):

                  try:
                      body = response.content
                      text = response.text
                  except Exception:
                      body = response.content
                      text = body.decode(
                          "utf-8",
                          errors="ignore"
                      )

                  soup = BeautifulSoup(
                      body,
                      "html.parser"
                  )

                  # ------------------------------
                  # HTML 标签中的 URL
                  # ------------------------------

                  for tag in soup.find_all(True):

                      for attr in URL_ATTRIBUTES:

                          if not tag.has_attr(
                              attr
                          ):
                              continue

                          value = tag.get(attr)

                          if isinstance(
                              value,
                              list
                          ):
                              value = " ".join(
                                  value
                              )

                          url = clean_url(
                              value,
                              response.url
                          )

                          if not url:
                              continue

                          parsed = urlparse(url)

                          host = normalize_host(
                              parsed.hostname
                          )

                          # 站内链接继续爬
                          if host in ALLOWED_HOSTS:

                              internal = (
                                  normalize_internal_url(
                                      url
                                  )
                              )

                              if (
                                  internal
                                  and internal
                                  not in visited
                              ):
                                  queue.append(
                                      internal
                                  )

                          # 外部链接只提取注册域名
                          else:

                              domain = (
                                  registered_domain(
                                      host
                                  )
                              )

                              if (
                                  domain
                                  and domain
                                  not in EXCLUDED_DOMAINS
                              ):
                                  domains.add(
                                      domain
                                  )

                  # ------------------------------
                  # HTML / JS / JSON 内 URL
                  # ------------------------------

                  for url in extract_urls(
                      text,
                      response.url
                  ):

                      parsed = urlparse(url)

                      host = normalize_host(
                          parsed.hostname
                      )

                      if host in ALLOWED_HOSTS:

                          internal = (
                              normalize_internal_url(
                                  url
                              )
                          )

                          if (
                              internal
                              and internal
                              not in visited
                          ):
                              queue.append(
                                  internal
                              )

                      else:

                          domain = (
                              registered_domain(
                                  host
                              )
                          )

                          if (
                              domain
                              and domain
                              not in EXCLUDED_DOMAINS
                          ):
                              domains.add(
                                  domain
                              )

                  # ------------------------------
                  # Script / JSON
                  # ------------------------------

                  for script in soup.find_all(
                      "script"
                  ):

                      script_text = (
                          script.string
                          or script.get_text()
                          or ""
                      )

                      if not script_text:
                          continue

                      for url in extract_urls(
                          script_text,
                          response.url
                      ):

                          parsed = urlparse(url)

                          host = normalize_host(
                              parsed.hostname
                          )

                          if host in ALLOWED_HOSTS:

                              internal = (
                                  normalize_internal_url(
                                      url
                                  )
                              )

                              if (
                                  internal
                                  and internal
                                  not in visited
                              ):
                                  queue.append(
                                      internal
                                  )

                          else:

                              domain = (
                                  registered_domain(
                                      host
                                  )
                              )

                              if (
                                  domain
                                  and domain
                                  not in EXCLUDED_DOMAINS
                              ):
                                  domains.add(
                                      domain
                                  )

              # ==================================
              # JSON / JS / CSS / XML 等
              # ==================================

              elif any(
                  x in content_type
                  for x in (
                      "json",
                      "javascript",
                      "text/plain",
                      "text/css",
                      "xml",
                  )
              ):

                  try:
                      text = response.text
                  except Exception:
                      text = response.content.decode(
                          "utf-8",
                          errors="ignore"
                      )

                  for url in extract_urls(
                      text,
                      response.url
                  ):

                      parsed = urlparse(url)

                      host = normalize_host(
                          parsed.hostname
                      )

                      if host in ALLOWED_HOSTS:

                          internal = (
                              normalize_internal_url(
                                  url
                              )
                          )

                          if (
                              internal
                              and internal
                              not in visited
                          ):
                              queue.append(
                                  internal
                              )

                      else:

                          domain = (
                              registered_domain(
                                  host
                              )
                          )

                          if (
                              domain
                              and domain
                              not in EXCLUDED_DOMAINS
                          ):
                              domains.add(
                                  domain
                              )

          domains = sorted(domains)

          print()
          print(
              "======================================"
          )
          print(
              "Internal pages:",
              len(visited)
          )
          print(
              "Final registered domains:",
              len(domains)
          )
          print(
              "======================================"
          )

          # ==================================
          # Surge LIST
          # ==================================

          with open(
              "ruleset/AdultWebsites.list",
              "w",
              encoding="utf-8"
          ) as f:

              for domain in domains:
                  f.write(
                      f"DOMAIN-SUFFIX,{domain}\n"
                  )

          # ==================================
          # MRS 临时输入
          # ==================================

          with open(
              "/tmp/AdultWebsites_mrs.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for domain in domains:
                  f.write(
                      f"+.{domain}\n"
                  )

          PY

      - name: Convert to MRS
        run: |
          set -e

          /tmp/mihomo convert-ruleset \
            domain \
            text \
            /tmp/AdultWebsites_mrs.txt \
            ruleset/AdultWebsites.mrs

      - name: Verify result
        run: |
          echo "======================================"
          echo "AdultWebsites"
          echo "======================================"

          echo
          echo "Surge:"
          wc -l ruleset/AdultWebsites.list

          echo
          echo "MRS:"
          ls -lh ruleset/AdultWebsites.mrs

          echo
          echo "First 30:"
          head -n 30 ruleset/AdultWebsites.list

          echo
          echo "Last 30:"
          tail -n 30 ruleset/AdultWebsites.list

      - name: Commit and push
        run: |
          set -e

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/AdultWebsites.list
          git add ruleset/AdultWebsites.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "Update AdultWebsites rules"

          git push
