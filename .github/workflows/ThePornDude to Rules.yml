name: Update ThePornDude Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            requests \
            beautifulsoup4

      - name: Crawl ThePornDude
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse
          import re
          import os

          URL = "https://theporndude.com/zh"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10; K) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Mobile Safari/537.36"
              )
          }

          print("Downloading:", URL)

          r = requests.get(
              URL,
              headers=headers,
              timeout=20
          )

          r.raise_for_status()

          print("HTTP:", r.status_code)
          print("HTML:", len(r.content), "bytes")

          soup = BeautifulSoup(
              r.content,
              "html.parser"
          )

          domains = set()

          # 常见多级公共后缀处理
          multi_suffixes = {
              "co.uk",
              "org.uk",
              "ac.uk",
              "gov.uk",
              "com.au",
              "net.au",
              "org.au",
              "com.br",
              "com.cn",
              "com.hk",
              "com.tw",
              "co.jp",
              "co.kr",
              "co.nz",
              "co.za",
              "com.sg",
              "com.mx",
              "com.tr",
              "com.ua",
              "com.pl",
              "com.ar",
              "com.co",
              "com.pe",
              "com.my",
              "com.ph",
              "com.pk",
              "com.vn",
              "com.id",
              "com.ng",
              "com.bd",
              "com.eg",
              "co.in",
              "co.il",
              "co.th",
              "co.id"
          }

          def get_root_domain(host):
              host = host.lower().strip(".")

              if host.startswith("www."):
                  host = host[4:]

              parts = host.split(".")

              if len(parts) < 2:
                  return None

              suffix2 = ".".join(parts[-2:])

              if suffix2 in multi_suffixes and len(parts) >= 3:
                  return ".".join(parts[-3:])

              return ".".join(parts[-2:])

          excluded = {
              "theporndude.com",
              "google.com",
              "googleapis.com",
              "gstatic.com",
              "google-analytics.com",
              "googletagmanager.com",
              "doubleclick.net",
              "facebook.com",
              "twitter.com",
              "x.com",
              "youtube.com",
              "instagram.com",
              "tiktok.com"
          }

          for tag in soup.find_all(
              ["a", "area"],
              href=True
          ):
              href = tag.get("href", "").strip()

              if not href:
                  continue

              if not href.startswith(
                  ("http://", "https://")
              ):
                  continue

              try:
                  parsed = urlparse(href)

                  host = parsed.hostname

                  if not host:
                      continue

                  root = get_root_domain(host)

                  if not root:
                      continue

                  if root in excluded:
                      continue

                  if root == "theporndude.com":
                      continue

                  # 基本域名合法性检查
                  if not re.match(
                      r"^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$",
                      root
                  ):
                      continue

                  domains.add(root)

              except Exception:
                  continue

          domains = sorted(domains)

          print()
          print("==============================")
          print("Domains found:", len(domains))
          print("==============================")

          for domain in domains:
              print(domain)

          if not domains:
              raise RuntimeError(
                  "No domains found. "
                  "ThePornDude page structure may have changed."
              )

          # 临时源文件，仅用于 Mihomo 转换
          os.makedirs(
              "/tmp/theporndude",
              exist_ok=True
          )

          with open(
              "/tmp/theporndude/domains.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(domains)
                  + "\n"
              )

          # Surge
          os.makedirs(
              "ruleset",
              exist_ok=True
          )

          with open(
              "ruleset/ThePornDude.list",
              "w",
              encoding="utf-8"
          ) as f:
              for domain in domains:
                  f.write(
                      f"DOMAIN-SUFFIX,{domain}\n"
                  )

          print()
          print(
              "Surge list generated:",
              "ruleset/ThePornDude.list"
          )
          PY

      - name: Download latest Mihomo
        run: |
          set -e

          mkdir -p /tmp/mihomo

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          URL=$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "$API" \
              | jq -r '
                .assets[]
                | select(
                    .name
                    | test("linux-amd64.*\\.gz$")
                  )
                | .browser_download_url
              ' \
              | head -n 1
          )

          if [ -z "$URL" ]; then
            echo "Mihomo download URL not found."
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$URL" \
            -o /tmp/mihomo/mihomo.gz

          gunzip -f \
            /tmp/mihomo/mihomo.gz

          chmod +x \
            /tmp/mihomo/mihomo

          /tmp/mihomo/mihomo version

      - name: Convert domain rules to MRS
        run: |
          set -e

          rm -f \
            ruleset/ThePornDude.mrs

          /tmp/mihomo/mihomo convert-ruleset \
            domain \
            text \
            /tmp/theporndude/domains.txt \
            ruleset/ThePornDude.mrs

          if [ ! -s ruleset/ThePornDude.mrs ]; then
            echo "MRS generation failed."
            exit 1
          fi

          echo
          echo "MRS generated:"
          ls -lh \
            ruleset/ThePornDude.mrs

      - name: Verify generated rules
        run: |
          set -e

          echo "========== Surge =========="
          wc -l \
            ruleset/ThePornDude.list

          echo
          echo "========== MRS =========="
          ls -lh \
            ruleset/ThePornDude.mrs

          echo
          echo "========== First 20 domains =========="
          head -n 20 \
            ruleset/ThePornDude.list

      - name: Cleanup
        run: |
          rm -rf /tmp/theporndude
          rm -rf /tmp/mihomo

      - name: Commit changes
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ruleset/ThePornDude.list \
            ruleset/ThePornDude.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "Update ThePornDude rules"

          git push