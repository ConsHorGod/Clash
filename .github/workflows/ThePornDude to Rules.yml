name: Update ThePornDude Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            requests \
            beautifulsoup4

      - name: Crawl ThePornDude
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse
          import re
          import os

          URL = "https://theporndude.com/zh"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          }

          print("Downloading:", URL)

          r = requests.get(
              URL,
              headers=headers,
              timeout=20
          )

          r.raise_for_status()

          print("HTTP:", r.status_code)
          print("HTML:", len(r.content), "bytes")

          soup = BeautifulSoup(
              r.content,
              "html.parser"
          )

          domains = set()

          multi_suffixes = {
              "co.uk",
              "org.uk",
              "ac.uk",
              "gov.uk",
              "com.au",
              "net.au",
              "org.au",
              "com.br",
              "com.cn",
              "com.hk",
              "com.tw",
              "co.jp",
              "co.kr",
              "co.nz",
              "co.za",
              "com.sg",
              "com.mx",
              "com.tr",
              "com.ua",
              "com.pl",
              "com.ar",
              "com.co",
              "com.pe",
              "com.my",
              "com.ph",
              "com.pk",
              "com.vn",
              "com.id",
              "com.ng",
              "com.bd",
              "com.eg",
              "co.in",
              "co.il",
              "co.th",
              "co.id"
          }

          def get_root_domain(host):
              host = host.lower().strip(".")

              if host.startswith("www."):
                  host = host[4:]

              parts = host.split(".")

              if len(parts) < 2:
                  return None

              suffix = ".".join(parts[-2:])

              if suffix in multi_suffixes and len(parts) >= 3:
                  return ".".join(parts[-3:])

              return suffix

          for tag in soup.find_all(
              ["a", "area"],
              href=True
          ):
              href = tag.get("href", "").strip()

              if not href.startswith(
                  ("http://", "https://")
              ):
                  continue

              try:
                  parsed = urlparse(href)

                  host = parsed.hostname

                  if not host:
                      continue

                  domain = get_root_domain(host)

                  if not domain:
                      continue

                  if domain == "theporndude.com":
                      continue

                  if domain.endswith(".theporndude.com"):
                      continue

                  if not re.match(
                      r"^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$",
                      domain
                  ):
                      continue

                  domains.add(domain)

              except Exception:
                  continue

          domains = sorted(domains)

          if not domains:
              raise RuntimeError(
                  "No domains found."
              )

          print(
              f"Found {len(domains)} domains."
          )

          os.makedirs(
              "/tmp/theporndude",
              exist_ok=True
          )

          with open(
              "/tmp/theporndude/domains.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for domain in domains:
                  f.write(domain + "\n")

          os.makedirs(
              "ruleset",
              exist_ok=True
          )

          with open(
              "ruleset/ThePornDude.list",
              "w",
              encoding="utf-8"
          ) as f:
              for domain in domains:
                  f.write(
                      f"DOMAIN-SUFFIX,{domain}\n"
                  )

          print(
              "Surge list generated."
          )
          PY

      - name: Prepare Mihomo
        run: |
          set -e

          if [ ! -f tools/mihomo ]; then
            echo "tools/mihomo not found."
            exit 1
          fi

          chmod +x tools/mihomo

          tools/mihomo version

      - name: Convert to MRS
        run: |
          set -e

          rm -f ruleset/ThePornDude.mrs

          tools/mihomo convert-ruleset \
            domain \
            text \
            /tmp/theporndude/domains.txt \
            ruleset/ThePornDude.mrs

          test -s ruleset/ThePornDude.mrs

          echo "MRS generated:"
          ls -lh ruleset/ThePornDude.mrs

      - name: Cleanup
        run: |
          rm -rf /tmp/theporndude

      - name: Show result
        run: |
          echo "========== Surge =========="
          wc -l ruleset/ThePornDude.list

          echo
          echo "========== MRS =========="
          ls -lh ruleset/ThePornDude.mrs

      - name: Commit changes
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ruleset/ThePornDude.list \
            ruleset/ThePornDude.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "Update ThePornDude rules"

          git push
