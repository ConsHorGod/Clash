name: Update China ASN

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install requests beautifulsoup4

      - name: Fetch China ASN from Hurricane Electric
        run: |
          python3 - <<'PY'
          import requests
          import re
          import os

          URL = "https://bgp.he.net/country/CN"

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          }

          r = requests.get(URL, headers=headers, timeout=60)
          r.raise_for_status()

          html = r.text

          # 提取页面中所有 ASxxxx
          asns = set(
              int(x)
              for x in re.findall(r'\bAS(\d+)\b', html, re.IGNORECASE)
          )

          # 只保留有效 ASN
          asns = sorted(x for x in asns if 1 <= x <= 4294967295)

          if not asns:
              raise RuntimeError("没有抓取到任何 ASN，可能是 HE 页面结构发生变化或触发限制。")

          print(f"Found {len(asns)} China ASNs")

          os.makedirs("ruleset", exist_ok=True)

          # Surge
          with open("ruleset/China_ASN.list", "w", encoding="utf-8") as f:
              for asn in asns:
                  f.write(f"IP-ASN,{asn}\n")

          # Clash / Mihomo
          with open("ruleset/China_ASN.yaml", "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for asn in asns:
                  f.write(f"  - IP-ASN,{asn}\n")

          print("Generated:")
          print("ruleset/China_ASN.list")
          print("ruleset/China_ASN.yaml")
          PY

      - name: Show result
        run: |
          echo "===== Surge ====="
          head -20 ruleset/China_ASN.list
          echo
          echo "===== Clash/Mihomo ====="
          head -20 ruleset/China_ASN.yaml
          echo
          echo "===== Statistics ====="
          echo "ASN count: $(grep -c '^IP-ASN,' ruleset/China_ASN.list)"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/China_ASN.list ruleset/China_ASN.yaml

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update China ASN"
          git push