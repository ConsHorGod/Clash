name: Update MY_RULE MRS

on:
  push:
    branches:
      - main
    paths:
      - "配置文件/Clash_DIRECT.yaml"
      - "配置文件/Clash_PROXY.yaml"
      - "配置文件/Clash_REJECT.yaml"

  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my-config
        uses: actions/checkout@v4

      - name: Download source rules
        run: |
          set -e

          mkdir -p source

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6/Clash_DIRECT.yaml" \
            -o source/Clash_DIRECT.yaml

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6/Clash_PROXY.yaml" \
            -o source/Clash_PROXY.yaml

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/ConsHorGod/my-config/refs/heads/%E9%85%8D%E7%BD%AE%E6%96%87%E4%BB%B6/Clash_REJECT.yaml" \
            -o source/Clash_REJECT.yaml

      - name: Download latest Mihomo
        run: |
          set -e

          MIHOMO_URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | jq -r '
              .assets[]
              | select(.name | test("mihomo-linux-amd64.*\\.gz$"))
              | .browser_download_url
            ' \
            | head -n 1)

          if [ -z "$MIHOMO_URL" ]; then
            echo "Failed to find Mihomo release."
            exit 1
          fi

          echo "Downloading Mihomo:"
          echo "$MIHOMO_URL"

          curl -L --fail --retry 3 \
            "$MIHOMO_URL" \
            -o /tmp/mihomo.gz

          gzip -d /tmp/mihomo.gz

          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Convert YAML to domain rules
        run: |
          set -e

          for name in DIRECT PROXY REJECT; do

            echo "================================"
            echo "Processing $name"
            echo "================================"

            python3 - "$name" <<'PY'
          import sys

          name = sys.argv[1]

          src = f"source/Clash_{name}.yaml"
          out = f"/tmp/{name}.txt"

          rules = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#"):
                      continue

                  if line.startswith("- "):
                      line = line[2:].strip()

                  parts = line.split(",", 2)

                  if len(parts) < 2:
                      continue

                  rule_type = parts[0].strip().upper()
                  value = parts[1].strip()

                  if not value:
                      continue

                  if rule_type == "DOMAIN":
                      rules.add("full:" + value)

                  elif rule_type == "DOMAIN-SUFFIX":
                      rules.add(value)

          rules = sorted(rules, key=str.lower)

          with open(out, "w", encoding="utf-8") as f:
              for rule in rules:
                  f.write(rule + "\n")

          print(f"{name}: {len(rules)} rules")
          PY

          done

      - name: Convert to MRS
        run: |
          set -e

          mkdir -p /tmp/mrs

          /tmp/mihomo convert-ruleset \
            domain text \
            /tmp/DIRECT.txt \
            /tmp/mrs/Clash_DIRECT.mrs

          /tmp/mihomo convert-ruleset \
            domain text \
            /tmp/PROXY.txt \
            /tmp/mrs/Clash_PROXY.mrs

          /tmp/mihomo convert-ruleset \
            domain text \
            /tmp/REJECT.txt \
            /tmp/mrs/Clash_REJECT.mrs

          echo "===== Generated MRS ====="

          ls -lh /tmp/mrs/

      - name: Push MRS to MY_RULE
        env:
          MY_RULE_TOKEN: ${{ secrets.MY_RULE_TOKEN }}
        run: |
          set -e

          if [ -z "$MY_RULE_TOKEN" ]; then
            echo "MY_RULE_TOKEN secret is not configured."
            exit 1
          fi

          rm -rf /tmp/MY_RULE

          git clone \
            "https://x-access-token:${MY_RULE_TOKEN}@github.com/ConsHorGod/MY_RULE.git" \
            /tmp/MY_RULE

          mkdir -p /tmp/MY_RULE/ruleset

          cp /tmp/mrs/Clash_DIRECT.mrs \
            /tmp/MY_RULE/ruleset/Clash_DIRECT.mrs

          cp /tmp/mrs/Clash_PROXY.mrs \
            /tmp/MY_RULE/ruleset/Clash_PROXY.mrs

          cp /tmp/mrs/Clash_REJECT.mrs \
            /tmp/MY_RULE/ruleset/Clash_REJECT.mrs

          cd /tmp/MY_RULE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/Clash_DIRECT.mrs
          git add ruleset/Clash_PROXY.mrs
          git add ruleset/Clash_REJECT.mrs

          if git diff --cached --quiet; then
            echo "No MRS changes."
            exit 0
          fi

          git commit -m "Update Clash MRS rules"

          git push origin main