      - name: Prepare MY rules
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import os

          files = [
              "MY_DIRECT.yaml",
              "MY_PROXY.yaml",
              "MY_REJECT.yaml"
          ]

          for src in files:
              with open(src, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  raise RuntimeError(f"{src} 不是有效 YAML")

              payload = data.get("payload", [])

              if not isinstance(payload, list):
                  raise RuntimeError(f"{src} payload 不是列表")

              clean = []

              for rule in payload:
                  if not isinstance(rule, str):
                      continue

                  rule = rule.strip()

                  if not rule:
                      continue

                  if rule.startswith("#"):
                      continue

                  # 修正用户文件中缺少逗号的 DOMAIN
                  if rule == "DOMAINntp.nasa.gov":
                      rule = "DOMAIN,ntp.nasa.gov"

                  elif rule == "DOMAINjlxa.wicp.net":
                      rule = "DOMAIN,jlxa.wicp.net"

                  # 只保留 DOMAIN / DOMAIN-SUFFIX
                  if rule.startswith("DOMAIN,"):
                      parts = rule.split(",", 1)

                  elif rule.startswith("DOMAIN-SUFFIX,"):
                      parts = rule.split(",", 1)

                  else:
                      continue

                  if len(parts) != 2:
                      continue

                  value = parts[1].strip()

                  if not value:
                      continue

                  clean.append(
                      f"{parts[0]},{value}"
                  )

              if not clean:
                  raise RuntimeError(
                      f"{src} 没有找到有效 DOMAIN 规则"
                  )

              with open(
                  f"/tmp/{src}",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("payload:\n")

                  for rule in clean:
                      f.write(f"  - {rule}\n")

              print(
                  f"{src}: {len(clean)} valid rules"
              )
          PY

          echo
          echo "===== MY_DIRECT ====="
          cat /tmp/MY_DIRECT.yaml

          echo
          echo "===== MY_PROXY ====="
          cat /tmp/MY_PROXY.yaml

          echo
          echo "===== MY_REJECT ====="
          cat /tmp/MY_REJECT.yaml