name: Update Clash Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget jq
          pip3 install --disable-pip-version-check requests beautifulsoup4

      - name: Prepare output directory
        run: |
          set -e
          mkdir -p RULESET
          rm -f RULESET/*.mrs
          rm -f RULESET/*.yaml

      - name: Download Blackmatrix7 rules
        run: |
          set -e

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt" \
            -o /tmp/ChinaMax_Domain.txt

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_IP.txt" \
            -o /tmp/ChinaMax_IP.txt

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Proxy/Proxy_Domain.txt" \
            -o /tmp/Proxy_Domain.txt

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Domain.txt" \
            -o /tmp/Global_Domain.txt

          curl -fL \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Classical.yaml" \
            -o /tmp/Global_Classical.yaml

          echo "===== Downloaded files ====="

          echo "ChinaMax Domain:"
          wc -l /tmp/ChinaMax_Domain.txt

          echo "ChinaMax IP:"
          wc -l /tmp/ChinaMax_IP.txt

          echo "Proxy Domain:"
          wc -l /tmp/Proxy_Domain.txt

          echo "Global Domain:"
          wc -l /tmp/Global_Domain.txt

          echo "Global Classical:"
          wc -l /tmp/Global_Classical.yaml

      - name: Download mihomo
        run: |
          set -e

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r .tag_name)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get Mihomo version"
            exit 1
          fi

          echo "Mihomo version: $VERSION"

          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" \
            -O /tmp/mihomo.gz

          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Convert ChinaMax Domain
        run: |
          set -e

          python3 - <<'PY'
          src = "/tmp/ChinaMax_Domain.txt"
          out = "/tmp/ChinaMax_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  if len(parts) >= 2:
                      rule_type = parts[0].upper()

                      if rule_type == "DOMAIN":
                          domains.add(parts[1])
                          continue

                      if rule_type == "DOMAIN-SUFFIX":
                          domains.add("+" + parts[1])
                          continue

                      if rule_type == "DOMAIN-KEYWORD":
                          domains.add("*" + parts[1] + "*")
                          continue

                  domains.add(parts[0])

          if not domains:
              echo "ChinaMax Domain source:"
              head -30 "$src"
              raise RuntimeError(
                  "ChinaMax Domain 没有提取到任何有效规则"
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"ChinaMax Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/ChinaMax_Domain.yaml \
            RULESET/ChinaMax_Domain.mrs

      - name: Convert ChinaMax IP
        run: |
          set -e

          python3 - <<'PY'
          import ipaddress

          src = "/tmp/ChinaMax_IP.txt"
          out = "/tmp/ChinaMax_IP.yaml"

          cidrs = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  candidates = []

                  if len(parts) >= 2:
                      rule_type = parts[0].upper()

                      if rule_type in (
                          "IP-CIDR",
                          "IP-CIDR6",
                          "IP-CIDR4"
                      ):
                          candidates.append(parts[1])
                      else:
                          candidates.append(parts[0])
                  else:
                      candidates.append(parts[0])

                  for candidate in candidates:
                      candidate = candidate.strip()

                      try:
                          network = ipaddress.ip_network(
                              candidate,
                              strict=False
                          )
                          cidrs.add(str(network))
                      except ValueError:
                          continue

          if not cidrs:
              print("===== ChinaMax IP SOURCE PREVIEW =====")

              with open(src, "r", encoding="utf-8") as f:
                  for i, line in enumerate(f):
                      print(repr(line.rstrip()))

                      if i >= 50:
                          break

              raise RuntimeError(
                  "ChinaMax IP 没有提取到任何有效 CIDR"
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')

          print(f"ChinaMax IP rules: {len(cidrs)}")
          PY

          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/ChinaMax_IP.yaml \
            RULESET/ChinaMax_IP.mrs

      - name: Convert Proxy Domain
        run: |
          set -e

          python3 - <<'PY'
          src = "/tmp/Proxy_Domain.txt"
          out = "/tmp/Proxy_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  if len(parts) >= 2:
                      rule_type = parts[0].upper()

                      if rule_type == "DOMAIN":
                          domains.add(parts[1])
                          continue

                      if rule_type == "DOMAIN-SUFFIX":
                          domains.add("+" + parts[1])
                          continue

                      if rule_type == "DOMAIN-KEYWORD":
                          domains.add("*" + parts[1] + "*")
                          continue

                  domains.add(parts[0])

          if not domains:
              raise RuntimeError(
                  "Proxy Domain 没有提取到任何有效规则"
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"Proxy Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Proxy_Domain.yaml \
            RULESET/Proxy_Domain.mrs

      - name: Convert Global Domain
        run: |
          set -e

          python3 - <<'PY'
          src = "/tmp/Global_Domain.txt"
          out = "/tmp/Global_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  if len(parts) >= 2:
                      rule_type = parts[0].upper()

                      if rule_type == "DOMAIN":
                          domains.add(parts[1])
                          continue

                      if rule_type == "DOMAIN-SUFFIX":
                          domains.add("+" + parts[1])
                          continue

                      if rule_type == "DOMAIN-KEYWORD":
                          domains.add("*" + parts[1] + "*")
                          continue

                  domains.add(parts[0])

          if not domains:
              raise RuntimeError(
                  "Global Domain 没有提取到任何有效规则"
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"Global Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Global_Domain.yaml \
            RULESET/Global_Domain.mrs

      - name: Convert Global Classical IP
        run: |
          set -e

          python3 - <<'PY'
          import re
          import ipaddress

          src = "/tmp/Global_Classical.yaml"
          out = "/tmp/Global_Classical_IP.yaml"

          cidrs = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(
                      r"^-\s*IP-CIDR6?,\s*([^,\s]+)",
                      line,
                      re.IGNORECASE
                  )

                  if not m:
                      continue

                  candidate = m.group(1).strip()

                  try:
                      network = ipaddress.ip_network(
                          candidate,
                          strict=False
                      )
                      cidrs.add(str(network))
                  except ValueError:
                      continue

          if not cidrs:
              raise RuntimeError(
                  "Global Classical IP 没有提取到任何有效 CIDR"
              )

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")

              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')

          print(f"Global Classical IP rules: {len(cidrs)}")
          PY

          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/Global_Classical_IP.yaml \
            RULESET/Global_Classical_IP.mrs

      - name: Fetch China ASN
        run: |
          set -e

          python3 - <<'PY'
          import requests
          import re

          URL = "https://bgp.he.net/country/CN"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          response = requests.get(
              URL,
              headers=headers,
              timeout=60
          )

          response.raise_for_status()

          html = response.text

          asns = set(
              int(x)
              for x in re.findall(
                  r'\bAS(\d+)\b',
                  html,
                  re.IGNORECASE
              )
          )

          asns = sorted(
              x for x in asns
              if 1 <= x <= 4294967295
          )

          if not asns:
              raise RuntimeError(
                  "没有抓取到中国 ASN"
              )

          print(f"Found {len(asns)} China ASNs")

          with open(
              "RULESET/China_ASN.yaml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("payload:\n")

              for asn in asns:
                  f.write(f"  - IP-ASN,{asn}\n")

          print(
              "Generated RULESET/China_ASN.yaml"
          )
          PY

      - name: Check output
        run: |
          set -e

          echo "========================================"
          echo "RULESET"
          echo "========================================"

          ls -lh RULESET/

          echo
          echo "========================================"
          echo "MRS"
          echo "========================================"

          ls -lh RULESET/*.mrs

          echo
          echo "========================================"
          echo "China ASN"
          echo "========================================"

          grep -c "IP-ASN," RULESET/China_ASN.yaml

          echo
          echo "========================================"
          echo "MRS COUNT"
          echo "========================================"

          find RULESET -name "*.mrs" | wc -l

          echo
          echo "========================================"
          echo "FILE CHECK"
          echo "========================================"

          test -s RULESET/ChinaMax_Domain.mrs
          test -s RULESET/ChinaMax_IP.mrs
          test -s RULESET/Proxy_Domain.mrs
          test -s RULESET/Global_Domain.mrs
          test -s RULESET/Global_Classical_IP.mrs
          test -s RULESET/China_ASN.yaml

          echo
          echo "All output files are valid."

      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RULESET/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Clash rules"
          git push