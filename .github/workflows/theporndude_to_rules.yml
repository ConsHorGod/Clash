name: Update ThePornDude Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests beautifulsoup4 tldextract

      - name: Crawl ThePornDude
        run: |
          python3 <<'PY'
          import requests
          import tldextract
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from collections import deque
          import os
          import re

          START_URL = "https://theporndude.com/zh"
          BASE_DOMAIN = "theporndude.com"

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              )
          })

          timeout = 20

          visited_pages = set()
          discovered_domains = set()

          queue = deque([START_URL])

          def registrable_domain(host):
              if not host:
                  return None

              host = host.lower().strip(".").rstrip(".")

              if host.startswith("www."):
                  host = host[4:]

              try:
                  result = tldextract.extract(host)

                  if not result.domain or not result.suffix:
                      return None

                  return f"{result.domain}.{result.suffix}".lower()

              except Exception:
                  return None

          def is_valid_external_domain(domain):
              if not domain:
                  return False

              if domain == BASE_DOMAIN:
                  return False

              if domain.endswith("." + BASE_DOMAIN):
                  return False

              # 排除明显不是网站域名的链接
              if domain in {
                  "google.com",
                  "googleapis.com",
                  "gstatic.com",
                  "googletagmanager.com",
                  "google-analytics.com",
                  "doubleclick.net",
                  "facebook.com",
                  "twitter.com",
                  "x.com",
                  "youtube.com",
                  "instagram.com",
                  "tiktok.com"
              }:
                  return False

              return True

          def normalize_url(url):
              try:
                  parsed = urlparse(url)

                  if parsed.scheme not in ("http", "https"):
                      return None

                  if not parsed.netloc:
                      return None

                  return f"{parsed.scheme}://{parsed.netloc}{parsed.path}"

              except Exception:
                  return None

          # 最大抓取页面数量，防止站点内部链接无限扩张
          MAX_PAGES = 5000

          while queue and len(visited_pages) < MAX_PAGES:
              current = queue.popleft()

              if current in visited_pages:
                  continue

              visited_pages.add(current)

              try:
                  response = session.get(
                      current,
                      timeout=timeout,
                      allow_redirects=True
                  )

                  if response.status_code != 200:
                      continue

                  content_type = response.headers.get(
                      "content-type", ""
                  ).lower()

                  if "text/html" not in content_type:
                      continue

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

              except Exception as e:
                  print(f"Failed: {current} -> {e}")
                  continue

              print(
                  f"[{len(visited_pages)}] "
                  f"Crawling: {current}"
              )

              for tag in soup.find_all("a", href=True):
                  href = tag.get("href", "").strip()

                  if not href:
                      continue

                  if href.startswith((
                      "#",
                      "javascript:",
                      "mailto:",
                      "tel:",
                      "data:"
                  )):
                      continue

                  absolute = urljoin(current, href)

                  try:
                      parsed = urlparse(absolute)
                  except Exception:
                      continue

                  if parsed.scheme not in ("http", "https"):
                      continue

                  host = parsed.hostname

                  if not host:
                      continue

                  host = host.lower().rstrip(".")

                  # 只继续爬 ThePornDude 自己的页面
                  if (
                      host == BASE_DOMAIN
                      or host.endswith("." + BASE_DOMAIN)
                  ):
                      normalized = normalize_url(absolute)

                      if normalized and normalized not in visited_pages:
                          queue.append(normalized)

                      continue

                  # 外部链接提取注册域名
                  domain = registrable_domain(host)

                  if is_valid_external_domain(domain):
                      discovered_domains.add(domain)

          # 清理明显无效项目
          final_domains = set()

          for domain in discovered_domains:
              domain = domain.lower().strip()

              if not domain:
                  continue

              if "." not in domain:
                  continue

              if domain.startswith("xn--"):
                  pass

              # 基本域名合法性检查
              if not re.match(
                  r"^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$",
                  domain
              ):
                  continue

              final_domains.add(domain)

          final_domains = sorted(final_domains)

          print()
          print("=" * 60)
          print(f"Pages crawled : {len(visited_pages)}")
          print(f"Domains found : {len(final_domains)}")
          print("=" * 60)

          for domain in final_domains:
              print(domain)

          os.makedirs("/tmp/theporndude", exist_ok=True)

          # 仅作为 Mihomo 转换时的临时输入
          with open(
              "/tmp/theporndude/domains.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for domain in final_domains:
                  f.write(domain + "\n")

          # 生成 Surge .list
          os.makedirs("ruleset", exist_ok=True)

          with open(
              "ruleset/ThePornDude.list",
              "w",
              encoding="utf-8"
          ) as f:
              for domain in final_domains:
                  f.write(f"DOMAIN-SUFFIX,{domain}\n")

          print()
          print(
              f"Generated Surge list: "
              f"ruleset/ThePornDude.list"
          )
          PY

      - name: Download Mihomo
        run: |
          set -e

          mkdir -p /tmp/mihomo

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION=$(curl -fsSL "$API" | jq -r '.tag_name')

          echo "Mihomo version: $VERSION"

          curl -fsSL "$API" \
            | jq -r '.assets[].browser_download_url' \
            | grep 'linux-amd64.*gz' \
            | head -n 1 \
            | xargs -I {} curl -fL "{}" \
              -o /tmp/mihomo/mihomo.gz

          gunzip -f /tmp/mihomo/mihomo.gz

          chmod +x /tmp/mihomo/mihomo

          /tmp/mihomo/mihomo version

      - name: Convert to MRS
        run: |
          set -e

          mkdir -p ruleset

          rm -f ruleset/ThePornDude.mrs

          /tmp/mihomo/mihomo convert-ruleset \
            domain \
            text \
            /tmp/theporndude/domains.txt \
            ruleset/ThePornDude.mrs

          test -s ruleset/ThePornDude.mrs

          echo "MRS generated:"
          ls -lh ruleset/ThePornDude.mrs

      - name: Remove temporary files
        run: |
          rm -rf /tmp/theporndude
          rm -rf /tmp/mihomo

      - name: Show result
        run: |
          echo "========== Rules =========="
          wc -l ruleset/ThePornDude.list

          echo
          echo "========== Files =========="
          ls -lh ruleset/ThePornDude.list
          ls -lh ruleset/ThePornDude.mrs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/ThePornDude.list
          git add ruleset/ThePornDude.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update ThePornDude rules"
          git push