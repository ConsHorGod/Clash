name: Update AdultBlock Rules

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 tldextract

      - name: Download latest Mihomo
        run: |
          set -e

          URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("mihomo-linux-amd64.*\\.gz$"))
              | .browser_download_url
            ' | head -n 1)

          test -n "$URL"

          curl -fL "$URL" -o /tmp/mihomo.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Crawl and build rules
        run: |
          mkdir -p ruleset

          python3 <<'PY'
          import requests
          import tldextract
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          START_URL = "https://theporndude.com/zh"

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          visited = set()
          external_urls = set()
          queue = [START_URL]

          allowed_hosts = {
              "theporndude.com",
              "www.theporndude.com",
          }

          excluded_domains = {
              "theporndude.com",
              "pdude.link",
              "google.com",
              "googleapis.com",
              "googletagmanager.com",
              "google-analytics.com",
              "twitter.com",
              "x.com",
              "facebook.com",
              "instagram.com",
              "youtube.com",
              "youtube-nocookie.com",
              "tiktok.com",
          }

          MAX_PAGES = 200

          def normalize_host(host):
              if not host:
                  return ""
              host = host.lower().strip().rstrip(".")
              if host.startswith("www."):
                  host = host[4:]
              return host

          def registered_domain(host):
              host = normalize_host(host)

              if not host:
                  return ""

              result = tldextract.extract(host)

              if not result.domain or not result.suffix:
                  return ""

              return f"{result.domain}.{result.suffix}".lower()

          while queue and len(visited) < MAX_PAGES:

              page = queue.pop(0)

              if page in visited:
                  continue

              visited.add(page)

              print("Fetching:", page)

              try:
                  response = session.get(
                      page,
                      timeout=30,
                      allow_redirects=True
                  )
                  response.raise_for_status()
              except Exception as e:
                  print("Failed:", e)
                  continue

              soup = BeautifulSoup(
                  response.text,
                  "html.parser"
              )

              for a in soup.find_all("a", href=True):

                  href = a["href"].strip()

                  if not href:
                      continue

                  if href.startswith(
                      ("#", "mailto:", "javascript:", "tel:")
                  ):
                      continue

                  absolute = urljoin(page, href)

                  try:
                      parsed = urlparse(absolute)
                  except Exception:
                      continue

                  if parsed.scheme not in ("http", "https"):
                      continue

                  host = normalize_host(parsed.hostname)

                  if not host:
                      continue

                  # 保存实际外部链接
                  if host not in allowed_hosts:
                      external_urls.add(absolute)

                  # 继续抓取 ThePornDude 自己的页面
                  if host in allowed_hosts:

                      internal = (
                          f"https://{host}{parsed.path}"
                      )

                      if parsed.query:
                          internal += "?" + parsed.query

                      if internal not in visited:
                          queue.append(internal)

          print()
          print("Internal pages:", len(visited))
          print("External URLs:", len(external_urls))

          domains = set()

          for url in external_urls:

              try:
                  host = urlparse(url).hostname
                  domain = registered_domain(host)

                  if not domain:
                      continue

                  if domain in excluded_domains:
                      continue

                  domains.add(domain)

              except Exception:
                  continue

          domains = sorted(domains)

          print("Final domains:", len(domains))

          # 直接生成 Surge LIST
          with open(
              "ruleset/AdultBlock.list",
              "w",
              encoding="utf-8"
          ) as f:

              for domain in domains:
                  f.write(
                      f"DOMAIN-SUFFIX,{domain},REJECT\n"
                  )

          # 生成 Mihomo MRS 转换输入
          with open(
              "/tmp/AdultBlock_mrs.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for domain in domains:
                  f.write(
                      f"+.{domain}\n"
                  )

          print("Generated AdultBlock.list")
          PY

      - name: Convert to MRS
        run: |
          /tmp/mihomo convert-ruleset \
            domain \
            text \
            /tmp/AdultBlock_mrs.txt \
            ruleset/AdultBlock.mrs

      - name: Show result
        run: |
          echo "========== Result =========="

          echo "Surge:"
          wc -l ruleset/AdultBlock.list

          echo "MRS:"
          ls -lh ruleset/AdultBlock.mrs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/AdultBlock.list
          git add ruleset/AdultBlock.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update AdultBlock rules"
          git push