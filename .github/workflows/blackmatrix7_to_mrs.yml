name: Update Global and ChinaMax to MRS
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Global_All
        run: |
          set -e
          curl -L --retry 5 --retry-delay 2 \
            -o Global_All.list \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/Global/Global_All.list"
      - name: Download ChinaMax_All
        run: |
          set -e
          curl -L --retry 5 --retry-delay 2 \
            -o ChinaMax_All.list \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/ChinaMax/ChinaMax_All.list"
      - name: Extract Domain and IP rules
        run: |
          set -e
          mkdir -p /tmp/rules
          python3 - <<'PY'
          from pathlib import Path
          sources = {
              "Global": Path("Global_All.list"),
              "ChinaMax": Path("ChinaMax_All.list"),
          }
          for name, src in sources.items():
              domains = set()
              ips = set()
              print(f"\nProcessing {src}...")
              with src.open("r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split(",", 1)
                      if len(parts) != 2:
                          continue
                      rule_type = parts[0].strip().upper()
                      value = parts[1].strip()
                      if not value:
                          continue
                      if rule_type in ("DOMAIN", "DOMAIN-SUFFIX"):
                          domains.add(value)
                      elif rule_type in ("IP-CIDR", "IP-CIDR6"):
                          ips.add(value)
              domain_file = Path(f"/tmp/rules/{name}_Domain.txt")
              ip_file = Path(f"/tmp/rules/{name}_IP.txt")
              domain_file.write_text(
                  "\n".join(sorted(domains)) + "\n",
                  encoding="utf-8"
              )
              ip_file.write_text(
                  "\n".join(sorted(ips)) + "\n",
                  encoding="utf-8"
              )
              print(f"{name} Domain rules: {len(domains)}")
              print(f"{name} IP rules: {len(ips)}")
          PY
      - name: Download Mihomo
        run: |
          set -e
          MIHOMO_VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name')
          echo "Mihomo version: ${MIHOMO_VERSION}"
          ASSET_URL=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep 'linux-amd64' \
            | grep '\.gz$' \
            | head -n 1)
          echo "Download: ${ASSET_URL}"
          curl -L --retry 5 --retry-delay 2 \
            -o mihomo.gz \
            "$ASSET_URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v
      - name: Create ruleset directory
        run: |
          mkdir -p ruleset
      - name: Convert Global Domain
        run: |
          set -e
          ./mihomo convert-ruleset \
            domain \
            text \
            /tmp/rules/Global_Domain.txt \
            ruleset/Global_Domain.mrs
      - name: Convert Global IP
        run: |
          set -e
          ./mihomo convert-ruleset \
            ipcidr \
            text \
            /tmp/rules/Global_IP.txt \
            ruleset/Global_IP.mrs
      - name: Convert ChinaMax Domain
        run: |
          set -e
          ./mihomo convert-ruleset \
            domain \
            text \
            /tmp/rules/ChinaMax_Domain.txt \
            ruleset/ChinaMax_Domain.mrs
      - name: Convert ChinaMax IP
        run: |
          set -e
          ./mihomo convert-ruleset \
            ipcidr \
            text \
            /tmp/rules/ChinaMax_IP.txt \
            ruleset/ChinaMax_IP.mrs
      - name: Show result
        run: |
          echo "========== MRS Files =========="
          ls -lh ruleset/Global_Domain.mrs
          ls -lh ruleset/Global_IP.mrs
          ls -lh ruleset/ChinaMax_Domain.mrs
          ls -lh ruleset/ChinaMax_IP.mrs
      - name: Commit and Push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/Global_Domain.mrs
          git add ruleset/Global_IP.mrs
          git add ruleset/ChinaMax_Domain.mrs
          git add ruleset/ChinaMax_IP.mrs
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update Global and ChinaMax MRS"
          git push