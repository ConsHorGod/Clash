name: Update blackmatrix7 to MRS

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download blackmatrix7 rules
        run: |
          mkdir -p ruleset

          curl -L \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt" \
            -o /tmp/ChinaMax_Domain.txt

          curl -L \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_IP.txt" \
            -o /tmp/ChinaMax_IP.txt

          curl -L \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Proxy/Proxy_Domain.txt" \
            -o /tmp/Proxy_Domain.txt

          curl -L \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Domain.txt" \
            -o /tmp/Global_Domain.txt

          curl -L \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global_Classical.yaml" \
            -o /tmp/Global_Classical.yaml

          curl -L \
            "https://yfamilys.com/rule/ASN-CN.rule" \
            -o /tmp/ASN-CN.rule

      - name: Download mihomo
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)

          wget -q \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" \
            -O /tmp/mihomo.gz

          gunzip /tmp/mihomo.gz
          chmod +x /tmp/mihomo

          /tmp/mihomo -v

      - name: Convert ChinaMax Domain to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/ChinaMax_Domain.txt"
          out = "/tmp/ChinaMax_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^DOMAIN-SUFFIX,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  m = re.match(r"^DOMAIN,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  if line.upper().startswith("DOMAIN-KEYWORD,"):
                      continue

                  if "," not in line and "/" not in line:
                      domains.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"ChinaMax Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/ChinaMax_Domain.yaml \
            ruleset/ChinaMax_Domain.mrs

      - name: Convert ChinaMax IP to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/ChinaMax_IP.txt"
          out = "/tmp/ChinaMax_IP.yaml"

          cidrs = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^IP-CIDR6?,(.+?)(?:,.*)?$", line, re.I)
                  if m:
                      cidrs.add(m.group(1).strip())
                      continue

                  if re.match(
                      r"^(?:\d{1,3}\.){3}\d{1,3}/\d{1,2}$",
                      line
                  ):
                      cidrs.add(line)
                      continue

                  if ":" in line and "/" in line:
                      cidrs.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')

          print(f"ChinaMax IP rules: {len(cidrs)}")
          PY

          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/ChinaMax_IP.yaml \
            ruleset/ChinaMax_IP.mrs

      - name: Convert Proxy Domain to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/Proxy_Domain.txt"
          out = "/tmp/Proxy_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^DOMAIN-SUFFIX,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  m = re.match(r"^DOMAIN,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  if line.upper().startswith("DOMAIN-KEYWORD,"):
                      continue

                  if "," not in line and "/" not in line:
                      domains.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"Proxy Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Proxy_Domain.yaml \
            ruleset/Proxy_Domain.mrs

      - name: Convert Global Domain to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/Global_Domain.txt"
          out = "/tmp/Global_Domain.yaml"

          domains = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^DOMAIN-SUFFIX,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  m = re.match(r"^DOMAIN,(.+)$", line, re.I)
                  if m:
                      domains.add(m.group(1).strip())
                      continue

                  if line.upper().startswith("DOMAIN-KEYWORD,"):
                      continue

                  if "," not in line and "/" not in line:
                      domains.add(line)

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for domain in sorted(domains):
                  f.write(f'  - "{domain}"\n')

          print(f"Global Domain rules: {len(domains)}")
          PY

          /tmp/mihomo convert-ruleset domain yaml \
            /tmp/Global_Domain.yaml \
            ruleset/Global_Domain.mrs

      - name: Convert Global Classical IP to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/Global_Classical.yaml"
          out = "/tmp/Global_Classical_IP.yaml"

          cidrs = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(
                      r"^-\s*IP-CIDR6?,\s*([^,\s]+)",
                      line,
                      re.I
                  )

                  if m:
                      cidr = m.group(1).strip()

                      if "/" in cidr:
                          cidrs.add(cidr)

                      continue

                  m = re.match(
                      r"^-\s*((?:\d{1,3}\.){3}\d{1,3}/\d{1,2})(?:\s|$)",
                      line
                  )

                  if m:
                      cidrs.add(m.group(1).strip())
                      continue

                  m = re.match(
                      r"^-\s*([0-9a-fA-F:]+/\d{1,3})(?:\s|$)",
                      line
                  )

                  if m:
                      cidrs.add(m.group(1).strip())

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for cidr in sorted(cidrs):
                  f.write(f'  - "{cidr}"\n')

          print(f"Global Classical IP rules: {len(cidrs)}")
          PY

          /tmp/mihomo convert-ruleset ipcidr yaml \
            /tmp/Global_Classical_IP.yaml \
            ruleset/Global_Classical_IP.mrs

      - name: Convert ASN-CN to MRS
        run: |
          python3 - <<'PY'
          import re

          src = "/tmp/ASN-CN.rule"
          out = "/tmp/ASN-CN.yaml"

          asns = set()

          with open(src, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  m = re.match(r"^IP-ASN,(\d+)(?:,.*)?$", line, re.I)

                  if m:
                      asns.add(m.group(1))

          with open(out, "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for asn in sorted(asns, key=int):
                  f.write(f'  - "{asn}"\n')

          print(f"ASN-CN rules: {len(asns)}")
          PY

          /tmp/mihomo convert-ruleset ip-asn yaml \
            /tmp/ASN-CN.yaml \
            ruleset/ASN-CN.mrs

      - name: Check output
        run: |
          echo "===== MRS files ====="

          ls -lh ruleset/ChinaMax_Domain.mrs
          ls -lh ruleset/ChinaMax_IP.mrs
          ls -lh ruleset/Proxy_Domain.mrs
          ls -lh ruleset/Global_Domain.mrs
          ls -lh ruleset/Global_Classical_IP.mrs
          ls -lh ruleset/ASN-CN.mrs

          echo "===== File type ====="

          file ruleset/ChinaMax_Domain.mrs
          file ruleset/ChinaMax_IP.mrs
          file ruleset/Proxy_Domain.mrs
          file ruleset/Global_Domain.mrs
          file ruleset/Global_Classical_IP.mrs
          file ruleset/ASN-CN.mrs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ruleset/ChinaMax_Domain.mrs
          git add ruleset/ChinaMax_IP.mrs
          git add ruleset/Proxy_Domain.mrs
          git add ruleset/Global_Domain.mrs
          git add ruleset/Global_Classical_IP.mrs
          git add ruleset/ASN-CN.mrs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ChinaMax Proxy Global Global Classical IP and ASN MRS"
            git push
          fi